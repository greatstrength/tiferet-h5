# Probe: unopened client raises ServiceError without HDF5 file I/O setup beyond construct.
testers:
  test_h5_client_raises:
    module_path: tiferet_h5.utils.h5
    class_name: H5Client
    tests:
      operation_before_open_raises:
        conditions: {}
        execute:
          - target:
              module_path: tempfile
              attribute: mkdtemp
            method: mkdtemp
            as: directory
          - target:
              module_path: pathlib
              attribute: Path
            method: Path
            args: [$r.directory, closed.h5]
            as: path_obj
          - target:
              module_path: builtins
              attribute: str
            method: str
            args: [$r.path_obj]
            as: path
          - target:
              module_path: importlib
              attribute: import_module
            method: import_module
            args: [tiferet_h5.utils.h5]
            as: mod
          - target:
              module_path: builtins
              attribute: getattr
            method: getattr
            args: [$r.mod, H5Client]
            as: cls
          - target: $r.cls
            method: __call__
            args: [$r.path]
            kwargs:
              mode: r
            as: client
          - target: $r.client
            method: node_exists
            args: [/]
            raises: true
            as: failure
        assert:
          - check: type
            outcome: failure
            module_path: tiferet.interfaces
            class_name: ServiceError
          - check: error_code
            outcome: failure
            error_code: H5_CONN_NOT_INITIALIZED
