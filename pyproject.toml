[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiferet-h5"
version = "1.0.0b2"
description = "HDF5 infrastructure extension for the Tiferet framework via PyTables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tiferet==2.2.2b1",
    "tables>=3.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tiferet_h5*"]

[tool.pytest.ini_options]
testpaths = ["tiferet_h5"]
